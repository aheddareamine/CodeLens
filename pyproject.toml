[project]
name = "codelens"
version = "0.1.0"
description = "RAG over the vLLM codebase: BM25 retrieval and Qwen3-0.6B answers"
readme = "README.md"
authors = [
    { name = "aheddareamine", email = "amine.aheddare-etu@etu.univh2c.ma" }
]
requires-python = ">=3.12"
dependencies = [
    "fire>=0.7.1",
    "pydantic>=2.14.2",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "transformers>=5.23.0",
]

[dependency-groups]
dev = [
    "flake8>=7.5.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
]

# CPU-only torch: the campus machine has no GPU, and the default
# PyPI torch for Linux pulls several GB of CUDA libraries.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# "mypy ." must not type-check the vLLM corpus or the venv.
[tool.mypy]
exclude = ["^data/", "^project_data/", "^\\.venv/"]
